<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>職業ビンゴ</title>
<style>
:root{--blue:#1565c0;--yellow:#ffd54f;--green:#2e7d32;--ink:#183247;--bg:#eef6ff}
*{box-sizing:border-box} body{margin:0;background:linear-gradient(145deg,#e3f2fd,#fff8e1);font-family:"Yu Gothic","Hiragino Kaku Gothic ProN",sans-serif;color:var(--ink);min-height:100vh;display:flex;justify-content:center}
.app{width:min(98vw,760px);padding:12px 12px 28px;text-align:center}h1{font-size:clamp(28px,5vw,44px);margin:4px 0 8px;color:#0d47a1;letter-spacing:.08em}
.guide{margin:0 0 10px;font-weight:700;font-size:clamp(14px,2.7vw,19px)}
.board{display:grid;grid-template-columns:repeat(3,1fr);gap:clamp(6px,1.5vw,12px);aspect-ratio:1/1;margin:auto}
.cell{position:relative;border:clamp(3px,.7vw,6px) solid var(--blue);border-radius:16px;background:white;padding:3px;overflow:hidden;cursor:pointer;box-shadow:0 4px 10px #3453;touch-action:manipulation;transition:transform .1s,background .15s}
.cell:active{transform:scale(.97)}.cell img{width:100%;height:100%;object-fit:contain;display:block;pointer-events:none}.cell .check{display:none;position:absolute;inset:0;background:#ffd54fb8;align-items:center;justify-content:center;font-size:clamp(54px,15vw,112px);font-weight:900;color:#167a32;text-shadow:0 3px white}
.cell.selected{border-color:var(--green);background:#fff8d5}.cell.selected .check{display:flex}.cell.bingo-line{animation:pulse .55s ease-in-out 3;border-color:#e65100}
@keyframes pulse{50%{transform:scale(1.05);filter:brightness(1.08)}}
.buttons{display:flex;gap:10px;justify-content:center;margin-top:12px;flex-wrap:wrap}button.action{font:700 clamp(16px,3vw,22px)/1 sans-serif;border:0;border-radius:999px;padding:13px 24px;color:white;background:var(--blue);box-shadow:0 4px 8px #2345;cursor:pointer}.reset{background:#607d8b!important}
#overlay{position:fixed;inset:0;background:#082c63d9;display:none;align-items:center;justify-content:center;z-index:10;padding:20px}#overlay.show{display:flex;animation:fade .25s}.message{background:white;border:8px solid var(--yellow);border-radius:30px;padding:30px 42px;box-shadow:0 16px 40px #0008}.message strong{display:block;font-size:clamp(58px,16vw,130px);color:#e65100;line-height:1}.message span{font-size:clamp(18px,4vw,28px);font-weight:700}.message button{margin-top:20px}
@keyframes fade{from{opacity:0}to{opacity:1}}@media(max-height:700px){h1{font-size:28px}.guide{display:none}.app{width:min(95vh,760px)}}
</style></head><body><main class="app"><h1>職業ビンゴ</h1><p class="guide">同じ職業が出たら、画像をタッチしよう！</p><section id="board" class="board" aria-label="3かける3のビンゴカード"></section><div class="buttons"><button class="action" id="new">新しいカード</button><button class="action reset" id="reset">チェックをもどす</button></div></main><div id="overlay" role="dialog" aria-modal="true"><div class="message"><strong>ビンゴ！</strong><span>1列そろいました</span><br><button class="action" id="close">つづける</button></div></div>

const board=document.getElementById('board'),overlay=document.getElementById('overlay');let cells=[],completed=new Set();
function shuffle(a){for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}
function newCard(){cells=shuffle([...ALL]).slice(0,9).map(x=>({...x,selected:false}));completed.clear();render()}
function render(){board.innerHTML='';cells.forEach((item,i)=>{const b=document.createElement('button');b.className='cell'+(item.selected?' selected':'');b.type='button';b.setAttribute('aria-label',item.name+(item.selected?' チェック済み':''));b.innerHTML=`<img src="${item.src}" alt="${item.name}"><span class="check" aria-hidden="true">✓</span>`;b.onclick=()=>toggle(i);board.appendChild(b)})}
const lines=[[0,1,2],[3,4,5],[6,7,8],[0,3,6],[1,4,7],[2,5,8],[0,4,8],[2,4,6]];
function toggle(i){cells[i].selected=!cells[i].selected;render();checkBingo()}
function checkBingo(){lines.forEach((line,n)=>{if(line.every(i=>cells[i].selected)&&!completed.has(n)){completed.add(n);line.forEach(i=>board.children[i].classList.add('bingo-line'));playSound();setTimeout(()=>overlay.classList.add('show'),250)}})}
function playSound(){const A=window.AudioContext||window.webkitAudioContext;if(!A)return;const c=new A();[523.25,659.25,783.99,1046.5].forEach((f,k)=>{const o=c.createOscillator(),g=c.createGain();o.type='triangle';o.frequency.value=f;g.gain.setValueAtTime(.0001,c.currentTime+k*.13);g.gain.exponentialRampToValueAtTime(.35,c.currentTime+k*.13+.02);g.gain.exponentialRampToValueAtTime(.0001,c.currentTime+k*.13+.35);o.connect(g).connect(c.destination);o.start(c.currentTime+k*.13);o.stop(c.currentTime+k*.13+.38)});setTimeout(()=>c.close(),1200)}
document.getElementById('new').onclick=()=>{overlay.classList.remove('show');newCard()};document.getElementById('reset').onclick=()=>{cells.forEach(x=>x.selected=false);completed.clear();overlay.classList.remove('show');render()};document.getElementById('close').onclick=()=>overlay.classList.remove('show');overlay.onclick=e=>{if(e.target===overlay)overlay.classList.remove('show')};newCard();
</script></body></html>
